<!-- ============ Vấn đề ============ -->
<section class="view" data-view="problem" hidden>

        <text x="65" y="30" text-anchor="middle"><tspan data-i18n="pb.fig.deal"></tspan> 1</text>
        <text x="160" y="30" text-anchor="middle"><tspan data-i18n="pb.fig.deal"></tspan> 2</text>

        <text class="weak-t" x="340" y="170" text-anchor="end" data-i18n="pb.fig.weak"></text>
      </svg>
      <figcaption id="pool-cap" class="muted" data-i18n="pb.fig.cap"></figcaption>

    <div><p class="big" data-i18n="pb.ev.1.n"></p><p data-i18n="pb.ev.1.t"></p></div>

  </div>

</section>

<!-- ============ Demo: Viễn cảnh ============ -->
<section class="view" data-view="demo/scen" hidden>
  <h1 data-i18n="sc.title"></h1>
  <p class="lede" data-i18n="sc.lede"></p>
  <p class="note" data-i18n="demo.acc.demo"></p>
  <div class="demo scen">
    <div>
      <h2 data-i18n="sc.add"></h2>
      <div class="steps-grid">
        <button type="button" data-add="long" data-i18n="sc.b.long"></button>
        <button type="button" data-add="short" data-i18n="sc.b.short"></button>
        <button type="button" data-add="deposit" data-i18n="sc.b.dep"></button>
        <button type="button" data-add="down" data-i18n="sc.b.down"></button>
        <button type="button" data-add="up" data-i18n="sc.b.up"></button>
      </div>
      <div class="steps-grid" id="sc-closers"></div>
      <div class="row-btns">
        <button type="button" class="btn" id="sc-undo" data-i18n="sc.undo"></button>
        <button type="button" class="btn" id="sc-reset" data-i18n="sc.reset"></button>
      </div>
      <h2 data-i18n="sc.chain"></h2>
      <ol class="chain" id="sc-chain" aria-live="polite"></ol>
      <p class="note" id="sc-state"></p>
      <p class="note" id="sc-processed" hidden></p>

    <div class="cube-box">
      <h2 data-i18n="sc.cube"></h2>
      <div class="seg" role="group">
        <button type="button" data-face="auto" data-i18n="sc.face.auto"></button>
        <button type="button" data-face="AB" data-i18n="sc.face.ab"></button>
        <button type="button" data-face="AC" data-i18n="sc.face.ac"></button>
      </div>
      <div class="stage3d" id="sc-cube"></div>
      <p class="note" data-i18n="sc.cube.note"></p>
    </div>
  </div>
</section>

<!-- ============ Demo: danh mục thật ============ -->
<section class="view" data-view="demo/port" hidden>

  <p class="lede" data-i18n="pt.lede"></p>
  <div class="seg wide" role="group">
    <button type="button" data-preset="A" data-i18n="pt.presetA"></button>
    <button type="button" data-preset="B" data-i18n="pt.presetB"></button>
  </div>
